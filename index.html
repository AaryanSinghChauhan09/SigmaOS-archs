<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Omarchs — King &amp; Queen of the Computer</title>
<meta name="description" content="The King and Queen of the Computer in the land of Omarchy. Long may they reign. Long may they compile.">
<meta property="og:title" content="The Omarchs">
<meta property="og:description" content="The King and Queen of the Computer in the land of Omarchy.">
<meta property="og:image" content="https://omarchs.fyi/og.jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://omarchs.fyi">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d9a93f;
    --gold-bright: #f3cf7a;
    --purple: #7a3ff2;
    --ink: #06030c;
    --text: #cfc4e8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: "Cormorant Garamond", Georgia, serif;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4rem 1.5rem 3rem;
    background-image:
      radial-gradient(ellipse 70% 45% at 50% 38%, rgba(122, 63, 242, 0.16), transparent 70%),
      radial-gradient(ellipse 40% 25% at 50% 90%, rgba(217, 169, 63, 0.07), transparent 70%);
  }
  h1 {
    font-family: Cinzel, Georgia, serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 8vw, 5rem);
    letter-spacing: 0.14em;
    background: linear-gradient(180deg, var(--gold-bright) 20%, var(--gold) 55%, #9a6f1e 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 60px rgba(217, 169, 63, 0.25);
  }
  .rule {
    width: min(22rem, 60vw);
    height: 1px;
    margin: 1.4rem auto 1.5rem;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    position: relative;
  }
  .rule::after {
    content: "◆";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--gold);
    font-size: 0.55rem;
    background: var(--ink);
    padding: 0 0.6rem;
  }
  .subtitle {
    font-size: clamp(1.15rem, 3vw, 1.5rem);
    font-style: italic;
    color: var(--text);
    max-width: 34em;
  }
  .thrones {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(1.5rem, 4vw, 3rem);
    margin: 3rem 0 2.75rem;
  }
  figure { max-width: min(420px, 88vw); }
  .frame {
    padding: 10px;
    border: 1px solid rgba(217, 169, 63, 0.55);
    outline: 1px solid rgba(217, 169, 63, 0.18);
    outline-offset: 5px;
    background: linear-gradient(180deg, rgba(217, 169, 63, 0.08), rgba(122, 63, 242, 0.06));
    box-shadow: 0 0 45px rgba(122, 63, 242, 0.18), 0 25px 60px rgba(0, 0, 0, 0.6);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }
  figure:hover .frame {
    transform: translateY(-6px);
    box-shadow: 0 0 70px rgba(122, 63, 242, 0.32), 0 35px 70px rgba(0, 0, 0, 0.65);
  }
  .frame img { display: block; width: 100%; height: auto; }
  figcaption { margin-top: 1.3rem; }
  figcaption strong {
    display: block;
    font-family: Cinzel, Georgia, serif;
    font-weight: 600;
    font-size: 1.35rem;
    letter-spacing: 0.22em;
    color: var(--gold-bright);
  }
  figcaption span {
    display: block;
    margin-top: 0.35rem;
    font-style: italic;
    font-size: 1.1rem;
    color: #9d8fc2;
  }
  /* The jester holds no throne. He wanders. */
  .jester {
    position: fixed;
    top: 0;
    left: 0;
    width: clamp(56px, 7vw, 82px);
    z-index: 10;
    cursor: pointer;
    border: 0;
    padding: 0;
    background: none;
    transition: transform 1.4s cubic-bezier(0.34, 0, 0.2, 1);
    -webkit-tap-highlight-color: transparent;
  }
  .jester:focus-visible { outline: none; }
  .jester:focus-visible .body { outline: 1px dashed var(--gold); outline-offset: 6px; }
  .jester .body {
    animation: caper 2.4s ease-in-out infinite;
    transform-origin: 50% 85%;
  }
  .jester:hover .body { animation-duration: 0.8s; }
  .jester .bells {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: jingle 2.4s ease-in-out infinite;
  }
  @keyframes jingle {
    0%, 100% { transform: rotate(0deg); }
    25%      { transform: rotate(3deg); }
    75%      { transform: rotate(-3deg); }
  }
  .jester.startled .body { animation: hop 0.4s ease-out; }
  .jester svg {
    display: block;
    width: 100%;
    height: auto;
    filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
  }
  @keyframes caper {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50%      { transform: translateY(-9px) rotate(5deg); }
  }
  @keyframes hop {
    0%   { transform: translateY(0) scale(1); }
    35%  { transform: translateY(-26px) scale(1.12) rotate(-14deg); }
    100% { transform: translateY(0) scale(1); }
  }
  .quip {
    position: absolute;
    bottom: calc(100% + 16px);
    left: 0;
    width: max-content;
    max-width: min(17rem, 62vw);
    padding: 0.55rem 0.85rem;
    background: rgba(15, 8, 26, 0.97);
    border: 1px solid rgba(217, 169, 63, 0.5);
    color: var(--gold-bright);
    font-size: clamp(0.95rem, 2.4vw, 1.05rem);
    font-style: italic;
    line-height: 1.35;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .quip.show { opacity: 1; }
  .quip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: var(--tail, 50%);
    width: 9px;
    height: 9px;
    margin: -5px 0 0 -4px;
    background: inherit;
    border-right: 1px solid rgba(217, 169, 63, 0.5);
    border-bottom: 1px solid rgba(217, 169, 63, 0.5);
    transform: rotate(45deg);
  }
  .quip.below {
    bottom: auto;
    top: calc(100% + 16px);
  }
  .quip.below::after {
    top: auto;
    bottom: 100%;
    margin: 0 0 -5px -4px;
    border: 0;
    border-left: 1px solid rgba(217, 169, 63, 0.5);
    border-top: 1px solid rgba(217, 169, 63, 0.5);
  }
  @media (prefers-reduced-motion: reduce) {
    .jester { transition: none; }
    .jester .body, .jester.startled .body, .jester .bells { animation: none; }
  }
  .proclamation {
    font-size: clamp(1.2rem, 3vw, 1.45rem);
    font-style: italic;
    color: var(--gold-bright);
    letter-spacing: 0.03em;
  }
  footer {
    margin-top: 3.5rem;
    font-size: 1.05rem;
  }
  footer a {
    color: #a789ff;
    text-decoration: none;
    border-bottom: 1px solid rgba(167, 137, 255, 0.35);
    padding-bottom: 1px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  footer a:hover { color: var(--gold-bright); border-color: var(--gold); }
</style>
</head>
<body>
  <h1>THE OMARCHS</h1>
  <div class="rule"></div>
  <p class="subtitle">The King &amp; Queen of the Computer, in the land of Omarchy. Sovereign over roughly one window manager.</p>

  <div class="thrones">
    <figure>
      <div class="frame"><img src="/king.jpeg" alt="The King of Omarchy — a crowned monarch in black and gold armor traced with circuitry" width="1254" height="1254"></div>
      <figcaption>
        <strong>THE KING</strong>
        <span>Defender of the Keyboard · Lord of the Tiling Realms</span>
      </figcaption>
    </figure>
    <figure>
      <div class="frame"><img src="/queen.jpeg" alt="The Queen of Omarchy — a crowned monarch in black and gold armor traced with circuitry" width="1254" height="1254"></div>
      <figcaption>
        <strong>THE QUEEN</strong>
        <span>Keeper of the Kernel · Sovereign of the Silent R</span>
      </figcaption>
    </figure>
  </div>

  <p class="proclamation">Long may they reign. Long may they compile.</p>

  <footer><a href="https://omarchy.org">omarchy.org →</a></footer>

  <button class="jester" id="jester" aria-label="The court jester. Activate for a remark.">
    <span class="quip" id="quip" aria-live="polite"></span>
    <span class="body">
      <svg viewBox="0 0 120 140" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="jgold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f6d98d"/><stop offset="1" stop-color="#b8862a"/>
          </linearGradient>
          <linearGradient id="jpurple" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8f52ff"/><stop offset="1" stop-color="#3d1580"/>
          </linearGradient>
          <radialGradient id="jbell" cx="0.35" cy="0.3" r="0.75">
            <stop offset="0" stop-color="#fff3cd"/><stop offset="0.55" stop-color="#e8bd5c"/><stop offset="1" stop-color="#a87620"/>
          </radialGradient>
        </defs>

        <!-- collar: a fan of motley points, belled at the tips -->
        <path d="M28 100 L34 118 L42 102 L51 120 L60 103 L69 120 L78 102 L86 118 L92 100 Z"
              fill="url(#jpurple)" stroke="#d9a93f" stroke-width="2" stroke-linejoin="round"/>
        <g fill="url(#jbell)" stroke="#a87620" stroke-width="1">
          <circle cx="34" cy="120" r="3"/><circle cx="51" cy="122" r="3.2"/>
          <circle cx="69" cy="122" r="3.2"/><circle cx="86" cy="120" r="3"/>
        </g>

        <!-- head -->
        <path d="M34 56 C32 82 45 102 60 102 C75 102 88 82 86 56 Z"
              fill="#150a2b" stroke="#d9a93f" stroke-width="2"/>

        <!-- mask -->
        <path d="M33 60 L46 54 L60 59 L74 54 L87 60 L84 74 L64 77 L60 73 L56 77 L36 74 Z"
              fill="#0b0518" stroke="#d9a93f" stroke-width="2" stroke-linejoin="round"/>
        <path d="M43 65 L53 63 L51 70 Z M77 65 L67 63 L69 70 Z" fill="#f3cf7a"/>

        <!-- sly grin -->
        <path d="M49 86 Q60 96 71 86" fill="none" stroke="#d9a93f" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M49 86 l-2.5 -4 M71 86 l2.5 -4" stroke="#d9a93f" stroke-width="2.4" stroke-linecap="round"/>

        <!-- cap: three sharp points, true motley -->
        <path d="M60 12 L58 58 L34 60 C28 50 20 40 10 32 C24 34 34 32 44 24 L52 18 Z"
              fill="url(#jgold)" stroke="#d9a93f" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M60 12 L62 58 L86 60 C92 50 100 40 110 32 C96 34 86 32 76 24 L68 18 Z"
              fill="url(#jpurple)" stroke="#d9a93f" stroke-width="2.2" stroke-linejoin="round"/>

        <!-- circuit traces, as on Their Majesties' armor -->
        <g stroke-width="1.1" fill="none" opacity="0.8" stroke-linecap="round">
          <path d="M38 50 L38 40 L28 36 M38 44 L46 44" stroke="#5a24c9"/>
          <path d="M82 50 L82 40 L92 36 M82 44 L74 44" stroke="#f3cf7a"/>
        </g>
        <circle cx="28" cy="36" r="1.6" fill="#5a24c9"/><circle cx="46" cy="44" r="1.4" fill="#5a24c9"/>
        <circle cx="92" cy="36" r="1.6" fill="#f3cf7a"/><circle cx="74" cy="44" r="1.4" fill="#f3cf7a"/>

        <!-- bells -->
        <g class="bells">
          <circle cx="60" cy="10" r="7.5" fill="url(#jbell)" stroke="#a87620" stroke-width="1.2"/>
          <circle cx="9" cy="31" r="7" fill="url(#jbell)" stroke="#a87620" stroke-width="1.2"/>
          <circle cx="111" cy="31" r="7" fill="url(#jbell)" stroke="#a87620" stroke-width="1.2"/>
          <g fill="#fff8e0" opacity="0.9">
            <circle cx="57.6" cy="7.6" r="1.7"/><circle cx="6.6" cy="28.6" r="1.6"/><circle cx="108.6" cy="28.6" r="1.6"/>
          </g>
        </g>
      </svg>
    </span>
  </button>

  <script>
    const REMARKS = [
      "Ricing is not engineering, my liege.",
      "The peasants whisper the whole castle was vibe coded.",
      "The worst distro on the market, they cry. It is not even a distro.",
      "Wait until they hear about NixOS.",
      "It's just a bunch of dotfiles.",
      "Congratulations, you have discovered i3.",
      "It's not a distro. It's a themes folder with a domain name.",
      "Two JPEGs, a gradient, and delusions of monarchy.",
      "Coronation was on a Tuesday. The build was red.",
      "Zero days since the last zero day, sire.",
    ];

    const jester = document.getElementById("jester");
    const quip = document.getElementById("quip");
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const between = (low, high) => low + Math.random() * Math.max(0, high - low);
    const clamp = (value, low, high) => Math.min(Math.max(value, low), Math.max(low, high));

    const PAD = 12;
    let spot = { x: PAD, y: PAD };
    let spoken = -1;
    let hush;

    // Whatever the viewport does — rotation, an iOS URL bar, a resized window — he stays inside it.
    const court = () => {
      const width = innerWidth;
      const height = visualViewport ? visualViewport.height : innerHeight;
      return {
        width,
        height,
        maxX: width - jester.offsetWidth - PAD,
        maxY: height - jester.offsetHeight - PAD,
      };
    };

    // The bubble hangs over his head, but never off the edge of the realm.
    const anchor = () => {
      const bubble = quip.offsetWidth;
      const middle = spot.x + jester.offsetWidth / 2;
      const left = clamp(middle - bubble / 2, PAD, innerWidth - bubble - PAD);

      quip.style.left = `${Math.round(left - spot.x)}px`;
      quip.style.setProperty("--tail", `${Math.round(middle - left)}px`);
    };

    const place = () => {
      const { height, maxX, maxY } = court();

      spot.x = clamp(spot.x, PAD, maxX);
      spot.y = clamp(spot.y, PAD, maxY);
      jester.style.transform = `translate(${Math.round(spot.x)}px, ${Math.round(spot.y)}px)`;
      quip.classList.toggle("below", spot.y < height * 0.25);
      anchor();
    };

    const roam = () => {
      const { width, height, maxX, maxY } = court();
      // Wide screens leave him the margins; narrow ones, the outer edges down low,
      // where he is clear of the portraits and the footer.
      const band = width > 900 ? 0.16 : 0.3;
      const nearSide = clamp(width * band - jester.offsetWidth, PAD, maxX);
      const farSide = clamp(width * (1 - band), PAD, maxX);

      spot.x = Math.random() < 0.5 ? between(PAD, nearSide) : between(farSide, maxX);
      spot.y = between(height * (width > 900 ? 0.12 : 0.58), maxY);
      place();
    };

    const heckle = () => {
      let next = spoken;
      while (next === spoken) next = Math.floor(Math.random() * REMARKS.length);
      spoken = next;

      quip.textContent = REMARKS[next];
      anchor();
      quip.classList.add("show");
      clearTimeout(hush);
      hush = setTimeout(() => quip.classList.remove("show"), 4500);
    };

    // The glide takes 1.4s (see .jester); he heckles on arrival, never mid-air
    // and never silently.
    const TRAVEL = calm ? 300 : 1500;
    let cycle;
    let voice;

    const schedule = (delay) => {
      clearTimeout(cycle);
      cycle = setTimeout(caper, delay);
    };

    const announce = (delay) => {
      clearTimeout(voice);
      voice = setTimeout(() => {
        heckle();
        schedule(between(2600, 4200));
      }, delay);
    };

    function caper() {
      if (document.hidden) return schedule(4000);
      quip.classList.remove("show");
      roam();
      announce(TRAVEL);
    }

    // Poked, he holds his ground long enough to get the line out.
    jester.addEventListener("click", () => {
      jester.classList.remove("startled");
      void jester.offsetWidth;
      jester.classList.add("startled");
      clearTimeout(voice);
      heckle();
      schedule(between(3600, 5000));
    });

    addEventListener("resize", place);
    addEventListener("orientationchange", place);
    if (visualViewport) visualViewport.addEventListener("resize", place);

    roam();
    announce(TRAVEL);
  </script>
</body>
</html>
